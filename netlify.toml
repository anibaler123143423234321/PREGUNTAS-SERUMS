[build]
  publish = "dist"
  command = "npm run build"

# Proxy for NVIDIA API in production Netlify (MUST be first before the SPA fallback)
[[redirects]]
  from = "/api/nvidia/*"
  to = "https://integrate.api.nvidia.com/v1/:splat"
  status = 200
  force = true

# SPA Fallback for Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
