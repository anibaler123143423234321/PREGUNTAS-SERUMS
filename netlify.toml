[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback for React Router / Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy for NVIDIA API in production Netlify if needed
[[redirects]]
  from = "/api/nvidia/*"
  to = "https://integrate.api.nvidia.com/v1/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}
